<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yuni Simanungkalit</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family: -apple-system, BlinkMacSystemFont, sans-serif}
body{margin:0;color:#444;background:#fcfaf7}
.hero{height:70vh;background:url('bg.jpg') center/cover no-repeat;position:relative;display:flex;align-items:center;justify-content:center;text-align:center}
.hero::after{content:'';position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,0.05),rgba(0,0,0,0.45))}
.hero-content{position:relative;z-index:2;color:white;padding:20px}
.hero-content img{width:130px;height:130px;border-radius:50%;object-fit:cover;border:4px solid white;box-shadow:0 8px 30px rgba(0,0,0,0.4)}
.hero-content h1{margin-top:14px;font-size:28px;letter-spacing:0.5px;text-shadow:0 2px 12px rgba(0,0,0,0.5)}
.hero-content p{margin-top:6px;font-size:15px;opacity:0.95}
.container{max-width:680px;margin:-40px auto 0;padding:20px;position:relative;z-index:3}
.card{background:white;border-radius:22px;padding:28px;margin-bottom:18px;box-shadow:0 12px 35px rgba(0,0,0,0.1)}
.bio{font-size:16px;line-height:1.7;white-space:pre-line}
.btn{display:inline-block;background:#222;color:white;padding:12px 24px;border-radius:999px;text-decoration:none;font-weight:600;margin-top:10px}
footer{text-align:center;padding:35px;color:#aaa;font-size:13px}
</style>
</head>
<body>
<div class="hero">
<div class="hero-content">
<img src="bg.jpg" alt="Yuni">
<h1>Yuni Simanungkalit</h1>
<p>Sunset lover 🌙</p>
</div>
</div>
<div class="container">
<div class="card">
<div class="bio">Hai, it's Yuni 🐣
Just a little album for memories 🌻
Thanks for stopping by...</div>
</div>
<div class="card">
<h2>📬 Say Hi</h2>
<a href="https://github.com/yunisimanungkalit" class="btn">My GitHub</a>
</div>
</div>
<footer>© 2026 Yuni Simanungkalit — little album for memories</footer>
</body>
</html>
